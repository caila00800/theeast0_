<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Work+Sans:wght@400;500&display=swap');

  :root{
    --ivory:     #fffff0;
    --paper:     #f4f0d8;
    --paper-2:   #ddd5a8;
    --khaki:     #b3a66a;
    --ink:       #2e2a16;
    --ink-soft:  #5a5430;
    --gold:      #6f5f22;
    --card:      #fffff2;
    --line:      rgba(74,44,23,0.3);
    --brown:     #4a2c17;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    min-height:100%;
    background:
      radial-gradient(130% 100% at 50% -10%, #ece5c2 0%, #d3c991 30%, #aa9d5f 65%, #7c6f40 100%);
    font-family:'Work Sans', sans-serif;
    color:var(--ink);
  }

  body{
    display:flex;
    justify-content:center;
    padding:64px 20px 80px;
  }

  main{
    width:100%;
    max-width:420px;
  }

  /* ---- header ---- */
  .avatar{
    width:112px;
    height:112px;
    margin:0 auto 30px;
    border-radius:50%;
    overflow:hidden;
    background:#ddd5a8;
    box-shadow:0 10px 30px -12px rgba(74,44,23,0.6);
  }
  .avatar img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size:2.4rem;
    text-align:center;
    letter-spacing:0.01em;
    color:var(--ink);
  }

  .tagline{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.05rem;
    text-align:center;
    color:var(--brown);
    margin-top:8px;
    line-height:1.5;
  }

  .signature{
    text-align:center;
    font-size:0.78rem;
    letter-spacing:0.02em;
    color:var(--brown);
    margin-top:10px;
  }

  /* ---- divider ---- */
  .divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:34px 0 26px;
  }
  .divider::before,
  .divider::after{
    content:"";
    height:1px;
    flex:1;
    background:var(--line);
  }
  .divider span{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:0.85rem;
    color:var(--ink-soft);
    white-space:nowrap;
  }

  /* ---- links ---- */
  .links{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .link-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
    text-decoration:none;
    color:var(--ink);
    transition:transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }

  .link-card:hover,
  .link-card:focus-visible{
    transform:translateY(-2px);
    border-color:rgba(111,95,34,0.55);
    box-shadow:0 12px 24px -14px rgba(46,42,22,0.35);
  }

  .link-card:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }

  .link-icon{
    flex:0 0 auto;
    width:34px;
    height:34px;
    border-radius:50%;
    background:linear-gradient(155deg, #f6f2d6, #cdc088);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .link-icon svg{ width:20px; height:20px; stroke:var(--gold); fill:none; }

  .link-text{ flex:1; min-width:0; }
  .link-title{
    font-size:0.95rem;
    font-weight:500;
    line-height:1.2;
  }
  .link-sub{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-top:2px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .link-arrow{
    flex:0 0 auto;
    color:var(--ink-soft);
    font-size:1.1rem;
  }

  /* ---- footer ---- */
  footer{
    text-align:center;
    margin-top:44px;
  }

  .footer-line{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:0.9rem;
    color:var(--ink-soft);
  }

  .footer-icons{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-top:16px;
  }
  .footer-icons a{
    color:var(--gold);
    opacity:0.8;
    transition:opacity 0.15s ease;
  }
  .footer-icons a:hover{ opacity:1; }
  .footer-icons svg{ width:18px; height:18px; }

  @media (prefers-reduced-motion: reduce){
    .link-card{ transition:none; }
  }
</style>
</head>

  <p class="tagline">“And so, that is how it is. Just you, left with two choices: to write or to perish.
Lend not your innermost depths a voice, nor entrust them unto the embrace of those you love. 
    For you shall regret it... You shall regret it...”</p>
  <p class="signature">— [𝔠𝔷]</p>
